# Small language models considered for nested elastic inference.
#
# `verified: true` means scripts/check_models.py fetched the model's config.json from the Hugging Face
# hub and its model_type matched this file (results/e0_model_facts_2026-10-13.json). Gated models and
# architectures the installed transformers cannot load stay `verified: false`.
# Re-run `python scripts/check_models.py` to refresh. Models whose
# `model_type` is not in elastoformer_moo.arch.SUPPORTED_MODEL_TYPES are listed so the gap is
# explicit; they are rejected with a clear error until an adapter exists.
models:
  # --- Llama architecture ---------------------------------------------------
  llama3.2-1b:
    hf_id: meta-llama/Llama-3.2-1B
    model_type: llama
    family: llama3
    gated: true          # needs accepted license and HF_TOKEN
    notes: First target model.
    license: llama3.2   # from the Hugging Face model card, 2026-10-13
    verified: false
  llama3.2-3b:
    hf_id: meta-llama/Llama-3.2-3B
    model_type: llama
    family: llama3
    gated: true
    notes: Second scale-up target; needs more than one A40 for full-parameter training.
    license: llama3.2   # from the Hugging Face model card, 2026-10-13
    verified: false
  tinyllama-1.1b:
